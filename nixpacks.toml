[phases.setup]
nixPkgs = ["nodejs_22", "corepack", "python3"]

[phases.prepare]
cmds = ["corepack enable", "corepack prepare pnpm@9.15.4 --activate"]

[phases.install]
cmds = ["pnpm config set store-dir .pnpm-store", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @platform/database generate", "pnpm --filter @platform/api build"]

[start]
cmd = "pnpm --filter @platform/api start:prod"
